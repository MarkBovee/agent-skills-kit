name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate plugin, hooks, and skills
        run: node ./scripts/validate-plugin.js

      - name: Validate trigger routing
        run: node ./scripts/check-trigger-overlap.js

      - name: Validate evidence-aware communication guidance
        run: node ./scripts/check-evidence-aware-communication.js

      - name: Validate model-agnostic guidance
        run: node ./scripts/check-model-agnostic-guidance.js

      - name: Validate router nudges
        run: node ./scripts/check-router-nudges.js

      - name: Validate workflow lifecycle
        run: node ./scripts/check-workflow-lifecycle.js

      - name: Validate research workflows
        run: node ./scripts/check-research-workflow.js

      - name: Validate ASK panel widget
        run: node ./scripts/check-panel-widget.js

      - name: Validate ASK widget live state
        run: node ./scripts/check-widget-live-state.js

      - name: Check release readiness
        run: node ./scripts/check-release-readiness.js

      - name: Regenerate platform exports
        run: node ./scripts/export-platform-skills.js

      - name: Check installed artifacts match repo strings
        run: ./scripts/check-installed-artifacts.sh

      - name: Ensure generated exports are committed
        run: |
          git diff --exit-code -- .github/skills .claude/skills .dsh/skills .opencode/commands .github/prompts CLAUDE.md .github/copilot-instructions.md
          test -z "$(git status --porcelain -- .github/skills .claude/skills .dsh/skills .opencode/commands .github/prompts CLAUDE.md .github/copilot-instructions.md)"
