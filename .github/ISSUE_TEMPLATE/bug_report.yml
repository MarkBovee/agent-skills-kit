name: Bug report
description: Report a bug in the kit, a skill, or the router plugin
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Which platform did this happen on (OpenCode, GitHub Copilot, Claude Code, dsh)?
      placeholder: e.g. OpenCode
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: Version of the kit (from `VERSION`, a tag like `v1.0.1`, or the install metadata file).
      placeholder: e.g. v1.0.1
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps, commands, or skill names involved.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that helps.
